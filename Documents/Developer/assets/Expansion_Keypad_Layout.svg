<text x="928.0" y="160.4" font-size="14" font-weight="bold" text-anchor="start" fill="#212121">Key groups</text>
<rect x="928.0" y="180.4" width="24.0" height="24.0" rx="4" fill="#37474f" stroke="#263238" stroke-width="1.2"/>
<text x="962.0" y="197.4" font-size="12.5" font-weight="normal" text-anchor="start" fill="#37474f">Function row</text>
<rect x="928.0" y="214.4" width="24.0" height="24.0" rx="4" fill="#1565c0" stroke="#263238" stroke-width="1.2"/>
<text x="962.0" y="231.4" font-size="12.5" font-weight="normal" text-anchor="start" fill="#37474f">VERB / NOUN</text>
<rect x="928.0" y="248.4" width="24.0" height="24.0" rx="4" fill="#eceff1" stroke="#263238" stroke-width="1.2"/>
<text x="962.0" y="265.4" font-size="12.5" font-weight="normal" text-anchor="start" fill="#37474f">Digits and sign</text>
<rect x="928.0" y="282.4" width="24.0" height="24.0" rx="4" fill="#ffe0b2" stroke="#263238" stroke-width="1.2"/>
<text x="962.0" y="299.4" font-size="12.5" font-weight="normal" text-anchor="start" fill="#37474f">Entry and action keys</text>
<text x="928.0" y="332.4" font-size="13" font-weight="bold" text-anchor="start" fill="#212121">Arrangement</text>
<text x="928.0" y="350.4" font-size="12" font-weight="normal" text-anchor="start" fill="#455a64">As on the Apollo DSKY: VERB / NOUN</text>
<text x="928.0" y="368.4" font-size="12" font-weight="normal" text-anchor="start" fill="#455a64">and ENTR / RSET sit half a key</text>
<text x="928.0" y="386.4" font-size="12" font-weight="normal" text-anchor="start" fill="#455a64">(10.5 mm) lower than the digit rows.</text>
<text x="928.0" y="404.4" font-size="12" font-weight="normal" text-anchor="start" fill="#455a64">Electrically they stay on ROW_1</text>
<text x="928.0" y="422.4" font-size="12" font-weight="normal" text-anchor="start" fill="#455a64">and ROW_2.</text>
<text x="928.0" y="458.4" font-size="13" font-weight="bold" text-anchor="start" fill="#212121">Matrix</text>
<text x="928.0" y="476.4" font-size="12" font-weight="normal" text-anchor="start" fill="#455a64">One 1N4148W diode per key.</text>
<text x="928.0" y="494.4" font-size="12" font-weight="normal" text-anchor="start" fill="#455a64">Columns driven low by the Teensy;</text>
<text x="928.0" y="512.4" font-size="12" font-weight="normal" text-anchor="start" fill="#455a64">rows read with pull-ups (§7.2).</text>
<text x="928.0" y="548.4" font-size="13" font-weight="bold" text-anchor="start" fill="#212121">Backlight</text>
<text x="928.0" y="566.4" font-size="12" font-weight="normal" text-anchor="start" fill="#455a64">SK6812MINI-EA per key, reverse</text>
<text x="928.0" y="584.4" font-size="12" font-weight="normal" text-anchor="start" fill="#455a64">mounted. Chained LED_0 (PROG) to</text>
<text x="928.0" y="602.4" font-size="12" font-weight="normal" text-anchor="start" fill="#455a64">LED_24 (KEY REL), left to right,</text>
<text x="928.0" y="620.4" font-size="12" font-weight="normal" text-anchor="start" fill="#455a64">top to bottom (§7.3).</text>
<text x="928.0" y="656.4" font-size="13" font-weight="bold" text-anchor="start" fill="#212121">Keycaps</text>
<text x="928.0" y="674.4" font-size="12" font-weight="normal" text-anchor="start" fill="#455a64">MBK caps with custom legends</text>
<text x="928.0" y="692.4" font-size="12" font-weight="normal" text-anchor="start" fill="#455a64">(FKcaps). Spacing check: E-17.</text>
<text x="928.0" y="710.4" font-size="12" font-weight="normal" text-anchor="start" fill="#455a64">Encoder role: E-20.</text>
