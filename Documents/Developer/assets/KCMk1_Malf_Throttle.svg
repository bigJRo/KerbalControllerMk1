<svg xmlns="http://www.w3.org/2000/svg" width="650" height="453" viewBox="0 0 650 453" font-family="Liberation Sans, Arial, Helvetica, sans-serif">
<defs>
<marker id="ahk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#263238"/></marker>
<marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker>
<marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker>
<marker id="ahp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6a1b9a"/></marker>
<marker id="aht" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#00838f"/></marker>
<marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<rect x="10.0" y="8.0" width="630.0" height="38.0" rx="0" fill="#ffffff" stroke="#263238" stroke-width="2.2"/>
<text x="325.0" y="33.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#263238">THROTTLE DOES NOT RESPOND</text>
<polyline points="185.0,46.0 185.0,65.0" fill="none" stroke="#263238" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahk)"/>
<polygon points="40.0,90.0 54.0,66.0 316.0,66.0 330.0,90.0 316.0,114.0 54.0,114.0" fill="#ffffff" stroke="#263238" stroke-width="1.6"/>
<circle cx="20.0" cy="90.0" r="10" fill="#ffffff" stroke="#263238" stroke-width="1.4"/>
<text x="20.0" y="94.0" font-size="11" font-weight="bold" text-anchor="middle" fill="#263238">1</text>
<text x="185.0" y="87.5" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#263238">Annunciator ENG ARM dark</text>
<text x="185.0" y="100.1" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#263238">(A2 ENGINE on SAFE)?</text>
<polyline points="330.0,90.0 369.0,90.0" fill="none" stroke="#263238" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahk)"/>
<text x="350.0" y="85.0" font-size="10" font-weight="bold" text-anchor="middle" fill="#263238">YES</text>
<rect x="370.0" y="64.1" width="270.0" height="51.8" rx="0" fill="#ffffff" stroke="#263238" stroke-width="1.6"/>
<text x="379.0" y="81.2" font-size="10.5" font-weight="normal" text-anchor="start" fill="#263238">A2 ENGINE – ARM.</text>
<text x="379.0" y="93.8" font-size="10.5" font-weight="normal" text-anchor="start" fill="#263238">The lever is driven to 0 %; throttle input</text>
<text x="379.0" y="106.4" font-size="10.5" font-weight="normal" text-anchor="start" fill="#263238">is taken once it is there.</text>
<text x="634.0" y="110.9" font-size="10.5" font-weight="bold" text-anchor="end" fill="#263238">&gt;&gt;</text>
<polyline points="185.0,114.0 185.0,137.0" fill="none" stroke="#263238" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahk)"/>
<text x="191.0" y="130.0" font-size="10" font-weight="bold" text-anchor="start" fill="#263238">NO</text>
<polygon points="40.0,162.0 54.0,138.0 316.0,138.0 330.0,162.0 316.0,186.0 54.0,186.0" fill="#ffffff" stroke="#263238" stroke-width="1.6"/>
<circle cx="20.0" cy="162.0" r="10" fill="#ffffff" stroke="#263238" stroke-width="1.4"/>
<text x="20.0" y="166.0" font-size="11" font-weight="bold" text-anchor="middle" fill="#263238">2</text>
<text x="185.0" y="159.5" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#263238">Annunciator THRTL PREC lit</text>
<text x="185.0" y="172.1" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#263238">(A2 THRTL on FINE)?</text>
<polyline points="330.0,162.0 369.0,162.0" fill="none" stroke="#263238" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahk)"/>
<text x="350.0" y="157.0" font-size="10" font-weight="bold" text-anchor="middle" fill="#263238">YES</text>
<rect x="370.0" y="129.8" width="270.0" height="64.4" rx="0" fill="#ffffff" stroke="#263238" stroke-width="1.6"/>
<text x="379.0" y="146.9" font-size="10.5" font-weight="normal" text-anchor="start" fill="#263238">In FINE the throttle buttons are ignored and</text>
<text x="379.0" y="159.5" font-size="10.5" font-weight="normal" text-anchor="start" fill="#263238">the lever covers ±10 % around the setting</text>
<text x="379.0" y="172.1" font-size="10.5" font-weight="normal" text-anchor="start" fill="#263238">at selection. For the buttons or full travel:</text>
<text x="379.0" y="184.7" font-size="10.5" font-weight="normal" text-anchor="start" fill="#263238">A2 THRTL – STD.</text>
<text x="634.0" y="189.2" font-size="10.5" font-weight="bold" text-anchor="end" fill="#263238">&gt;&gt;</text>
<polyline points="185.0,186.0 185.0,209.0" fill="none" stroke="#263238" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahk)"/>
<text x="191.0" y="202.0" font-size="10" font-weight="bold" text-anchor="start" fill="#263238">NO</text>
<polygon points="40.0,234.0 54.0,210.0 316.0,210.0 330.0,234.0 316.0,258.0 54.0,258.0" fill="#ffffff" stroke="#263238" stroke-width="1.6"/>
<circle cx="20.0" cy="234.0" r="10" fill="#ffffff" stroke="#263238" stroke-width="1.4"/>
<text x="20.0" y="238.0" font-size="11" font-weight="bold" text-anchor="middle" fill="#263238">3</text>
<text x="185.0" y="231.5" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#263238">Annunciator AUTOPILOT lit, with an</text>
<text x="185.0" y="244.1" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#263238">autopilot using the throttle?</text>
<polyline points="330.0,234.0 369.0,234.0" fill="none" stroke="#263238" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahk)"/>
<text x="350.0" y="229.0" font-size="10" font-weight="bold" text-anchor="middle" fill="#263238">YES</text>
<rect x="370.0" y="201.8" width="270.0" height="64.4" rx="0" fill="#ffffff" stroke="#263238" stroke-width="1.6"/>
<text x="379.0" y="218.9" font-size="10.5" font-weight="normal" text-anchor="start" fill="#263238">Lever and buttons are ignored. Disconnect:</text>
<text x="379.0" y="231.5" font-size="10.5" font-weight="normal" text-anchor="start" fill="#263238">RHC stick button (SPC, PLN), A/P OFF on</text>
<text x="379.0" y="244.1" font-size="10.5" font-weight="normal" text-anchor="start" fill="#263238">the Information Display 2 console, or</text>
<text x="379.0" y="256.7" font-size="10.5" font-weight="normal" text-anchor="start" fill="#263238">A2 A/P – INHIB.</text>
<text x="634.0" y="261.2" font-size="10.5" font-weight="bold" text-anchor="end" fill="#263238">&gt;&gt;</text>
<polyline points="185.0,258.0 185.0,281.0" fill="none" stroke="#263238" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahk)"/>
<text x="191.0" y="274.0" font-size="10" font-weight="bold" text-anchor="start" fill="#263238">NO</text>
<polygon points="40.0,306.0 54.0,282.0 316.0,282.0 330.0,306.0 316.0,330.0 54.0,330.0" fill="#ffffff" stroke="#263238" stroke-width="1.6"/>
<circle cx="20.0" cy="306.0" r="10" fill="#ffffff" stroke="#263238" stroke-width="1.4"/>
<text x="20.0" y="310.0" font-size="11" font-weight="bold" text-anchor="middle" fill="#263238">4</text>
<text x="185.0" y="303.5" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#263238">Out of a flight scene, or Annunciator</text>
<text x="185.0" y="316.1" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#263238">SIMPIT LOST or DEMO lit?</text>
<polyline points="330.0,306.0 369.0,306.0" fill="none" stroke="#263238" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahk)"/>
<text x="350.0" y="301.0" font-size="10" font-weight="bold" text-anchor="middle" fill="#263238">YES</text>
<rect x="370.0" y="273.8" width="270.0" height="64.4" rx="0" fill="#ffffff" stroke="#263238" stroke-width="1.6"/>
<text x="379.0" y="290.9" font-size="10.5" font-weight="normal" text-anchor="start" fill="#263238">Enter a flight scene.</text>
<text x="379.0" y="303.5" font-size="10.5" font-weight="normal" text-anchor="start" fill="#263238">SIMPIT LOST lit: reconnect (Section 8.8).</text>
<text x="379.0" y="316.1" font-size="10.5" font-weight="normal" text-anchor="start" fill="#263238">DEMO lit: A2 SCE – NORM (in demo mode</text>
<text x="379.0" y="328.7" font-size="10.5" font-weight="normal" text-anchor="start" fill="#263238">nothing is sent to KSP).</text>
<text x="634.0" y="333.2" font-size="10.5" font-weight="bold" text-anchor="end" fill="#263238">&gt;&gt;</text>
<polyline points="185.0,330.0 185.0,353.0" fill="none" stroke="#263238" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahk)"/>
<text x="191.0" y="346.0" font-size="10" font-weight="bold" text-anchor="start" fill="#263238">NO</text>
<rect x="20.0" y="354.0" width="620.0" height="53.8" rx="0" fill="#ffffff" stroke="#263238" stroke-width="1.6"/>
<text x="29.0" y="372.1" font-size="10.5" font-weight="normal" text-anchor="start" fill="#263238">Open the input test screen on Information Display 1 (Section 10.3). THROTTLE row ACTIVE, and</text>
<text x="29.0" y="384.7" font-size="10.5" font-weight="normal" text-anchor="start" fill="#263238">the lever bar and button boxes follow the controls? Row MISSING: turn the controller off and</text>
<text x="29.0" y="397.3" font-size="10.5" font-weight="normal" text-anchor="start" fill="#263238">reseat the Throttle module's 16-pin cable.</text>
<text x="634.0" y="402.8" font-size="10.5" font-weight="bold" text-anchor="end" fill="#263238">&gt;&gt;</text>
<text x="10.0" y="427.8" font-size="10" font-weight="normal" text-anchor="start" fill="#607d8b">Number: decision · YES: do the action on the right · NO: go down to the next step.</text>
<text x="10.0" y="441.8" font-size="10" font-weight="normal" text-anchor="start" fill="#607d8b">&gt;&gt;  End of procedure. If the symptom remains, return to that step and take its NO branch.</text>
</svg>