<text x="379.0" y="303.5" font-size="10.5" font-weight="normal" text-anchor="start" fill="#263238">GPWS sounds only in a flight scene.</text>
<text x="379.0" y="316.1" font-size="10.5" font-weight="normal" text-anchor="start" fill="#263238">Enter a flight.</text>
<text x="634.0" y="320.6" font-size="10.5" font-weight="bold" text-anchor="end" fill="#263238">&gt;&gt;</text>
