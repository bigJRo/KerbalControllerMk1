<circle cx="20.0" cy="234.0" r="10" fill="#ffffff" stroke="#263238" stroke-width="1.4"/>
<text x="20.0" y="238.0" font-size="11" font-weight="bold" text-anchor="middle" fill="#263238">3</text>
<text x="185.0" y="231.5" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#263238">GPWS display blank, A2 ENA</text>
<text x="185.0" y="244.1" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#263238">backlit only (GPWS OFF)?</text>
<polyline points="330.0,234.0 369.0,234.0" fill="none" stroke="#263238" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahk)"/>
<text x="350.0" y="229.0" font-size="10" font-weight="bold" text-anchor="middle" fill="#263238">YES</text>
<rect x="370.0" y="208.1" width="270.0" height="51.8" rx="0" fill="#ffffff" stroke="#263238" stroke-width="1.6"/>
<text x="379.0" y="225.2" font-size="10.5" font-weight="normal" text-anchor="start" fill="#263238">Press A2 ENA: lit green = full GPWS,</text>
<text x="379.0" y="237.8" font-size="10.5" font-weight="normal" text-anchor="start" fill="#263238">lit amber = callouts only. PROX and RNDZ</text>
<text x="379.0" y="250.4" font-size="10.5" font-weight="normal" text-anchor="start" fill="#263238">also select callouts only.</text>
<text x="634.0" y="254.9" font-size="10.5" font-weight="bold" text-anchor="end" fill="#263238">&gt;&gt;</text>
