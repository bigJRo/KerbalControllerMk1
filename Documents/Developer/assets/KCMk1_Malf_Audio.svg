<text x="185.0" y="87.5" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#263238">Annunciator AUDIO dark</text>
<text x="185.0" y="100.1" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#263238">(B2 AUDIO on MUTE)?</text>
