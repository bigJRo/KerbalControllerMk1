<rect width="100%" height="100%" fill="#ffffff"/>
<rect x="10.0" y="8.0" width="630.0" height="38.0" rx="0" fill="#ffffff" stroke="#263238" stroke-width="2.2"/>
<text x="325.0" y="33.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#263238">NO AUDIO / NO GPWS CALLOUTS</text>
