<text x="379.0" y="369.2" font-size="10.5" font-weight="normal" text-anchor="start" fill="#263238">Load the Annunciator DFPlayer Mini card</text>
<text x="379.0" y="381.8" font-size="10.5" font-weight="normal" text-anchor="start" fill="#263238">from Software/Displays/SD_Cards</text>
<text x="379.0" y="394.4" font-size="10.5" font-weight="normal" text-anchor="start" fill="#263238">(Section 11.4).</text>
<text x="634.0" y="398.9" font-size="10.5" font-weight="bold" text-anchor="end" fill="#263238">&gt;&gt;</text>
<polyline points="185.0,402.0 185.0,425.0" fill="none" stroke="#263238" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahk)"/>
<text x="191.0" y="418.0" font-size="10" font-weight="bold" text-anchor="start" fill="#263238">NO</text>
<rect x="20.0" y="426.0" width="620.0" height="53.8" rx="0" fill="#ffffff" stroke="#263238" stroke-width="1.6"/>
<text x="29.0" y="444.1" font-size="10.5" font-weight="normal" text-anchor="start" fill="#263238">Turn the controller off and check the SPEAKER 2 lead (GPWS voice, DFPlayer) on the Annunciator</text>
<text x="29.0" y="456.7" font-size="10.5" font-weight="normal" text-anchor="start" fill="#263238">driver. Callouts sound only when their condition occurs; callouts only (amber) gives no warnings</text>
<text x="29.0" y="469.3" font-size="10.5" font-weight="normal" text-anchor="start" fill="#263238">(Section 6).</text>
<text x="634.0" y="474.8" font-size="10.5" font-weight="bold" text-anchor="end" fill="#263238">&gt;&gt;</text>
<text x="10.0" y="499.8" font-size="10" font-weight="normal" text-anchor="start" fill="#607d8b">Number: decision · YES: do the action on the right · NO: go down to the next step.</text>
<text x="10.0" y="513.8" font-size="10" font-weight="normal" text-anchor="start" fill="#607d8b">&gt;&gt;  End of procedure. If the symptom remains, return to that step and take its NO branch.</text>
