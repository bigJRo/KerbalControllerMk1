<text x="20.0" y="166.0" font-size="11" font-weight="bold" text-anchor="middle" fill="#263238">2</text>
<text x="185.0" y="159.5" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#263238">Master alarm and the other</text>
<text x="185.0" y="172.1" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#263238">audio cues silent too?</text>
