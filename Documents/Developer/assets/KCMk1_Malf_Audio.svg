<text x="350.0" y="85.0" font-size="10" font-weight="bold" text-anchor="middle" fill="#263238">YES</text>
<rect x="370.0" y="64.1" width="270.0" height="51.8" rx="0" fill="#ffffff" stroke="#263238" stroke-width="1.6"/>
<text x="379.0" y="81.2" font-size="10.5" font-weight="normal" text-anchor="start" fill="#263238">B2 AUDIO – LIVE.</text>
<text x="379.0" y="93.8" font-size="10.5" font-weight="normal" text-anchor="start" fill="#263238">MUTE silences every output, the master</text>
<text x="379.0" y="106.4" font-size="10.5" font-weight="normal" text-anchor="start" fill="#263238">alarm included.</text>
<text x="634.0" y="110.9" font-size="10.5" font-weight="bold" text-anchor="end" fill="#263238">&gt;&gt;</text>
