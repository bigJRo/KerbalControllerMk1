<text x="379.0" y="153.2" font-size="10.5" font-weight="normal" text-anchor="start" fill="#263238">Turn the controller off and check the</text>
<text x="379.0" y="165.8" font-size="10.5" font-weight="normal" text-anchor="start" fill="#263238">SPEAKER 1 lead (alarm tones, PAM8302A</text>
<text x="379.0" y="178.4" font-size="10.5" font-weight="normal" text-anchor="start" fill="#263238">amplifier) on the Annunciator driver.</text>
<text x="634.0" y="182.9" font-size="10.5" font-weight="bold" text-anchor="end" fill="#263238">&gt;&gt;</text>
