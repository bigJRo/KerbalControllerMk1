<svg xmlns="http://www.w3.org/2000/svg" width="650" height="513" viewBox="0 0 650 513" font-family="Liberation Sans, Arial, Helvetica, sans-serif">
<defs>
<marker id="ahk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#263238"/></marker>
<marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker>
<marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker>
<marker id="ahp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6a1b9a"/></marker>
<marker id="aht" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#00838f"/></marker>
<marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<rect x="10.0" y="8.0" width="630.0" height="38.0" rx="0" fill="#ffffff" stroke="#263238" stroke-width="2.2"/>
<text x="325.0" y="33.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#263238">FEWER THAN 5 KSP LINKS / SIMPIT LOST</text>
<polyline points="185.0,46.0 185.0,65.0" fill="none" stroke="#263238" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahk)"/>
<polygon points="40.0,90.0 54.0,66.0 316.0,66.0 330.0,90.0 316.0,114.0 54.0,114.0" fill="#ffffff" stroke="#263238" stroke-width="1.6"/>
<circle cx="20.0" cy="90.0" r="10" fill="#ffffff" stroke="#263238" stroke-width="1.4"/>
<text x="20.0" y="94.0" font-size="11" font-weight="bold" text-anchor="middle" fill="#263238">1</text>
<text x="185.0" y="87.5" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#263238">KSP not running, or no game</text>
<text x="185.0" y="100.1" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#263238">loaded?</text>
<polyline points="330.0,90.0 369.0,90.0" fill="none" stroke="#263238" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahk)"/>
<text x="350.0" y="85.0" font-size="10" font-weight="bold" text-anchor="middle" fill="#263238">YES</text>
<rect x="370.0" y="64.1" width="270.0" height="51.8" rx="0" fill="#ffffff" stroke="#263238" stroke-width="1.6"/>
<text x="379.0" y="81.2" font-size="10.5" font-weight="normal" text-anchor="start" fill="#263238">Start KSP and load the game.</text>
<text x="379.0" y="93.8" font-size="10.5" font-weight="normal" text-anchor="start" fill="#263238">The controller retries the link every</text>
<text x="379.0" y="106.4" font-size="10.5" font-weight="normal" text-anchor="start" fill="#263238">few seconds.</text>
<text x="634.0" y="110.9" font-size="10.5" font-weight="bold" text-anchor="end" fill="#263238">&gt;&gt;</text>
<polyline points="185.0,114.0 185.0,137.0" fill="none" stroke="#263238" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahk)"/>
<text x="191.0" y="130.0" font-size="10" font-weight="bold" text-anchor="start" fill="#263238">NO</text>
<polygon points="40.0,162.0 54.0,138.0 316.0,138.0 330.0,162.0 316.0,186.0 54.0,186.0" fill="#ffffff" stroke="#263238" stroke-width="1.6"/>
<circle cx="20.0" cy="162.0" r="10" fill="#ffffff" stroke="#263238" stroke-width="1.4"/>
<text x="20.0" y="166.0" font-size="11" font-weight="bold" text-anchor="middle" fill="#263238">2</text>
<text x="185.0" y="159.5" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#263238">Annunciator DEMO lit</text>
<text x="185.0" y="172.1" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#263238">(A2 SCE on AUX)?</text>
<polyline points="330.0,162.0 369.0,162.0" fill="none" stroke="#263238" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahk)"/>
<text x="350.0" y="157.0" font-size="10" font-weight="bold" text-anchor="middle" fill="#263238">YES</text>
<rect x="370.0" y="136.1" width="270.0" height="51.8" rx="0" fill="#ffffff" stroke="#263238" stroke-width="1.6"/>
<text x="379.0" y="153.2" font-size="10.5" font-weight="normal" text-anchor="start" fill="#263238">A2 SCE – NORM.</text>
<text x="379.0" y="165.8" font-size="10.5" font-weight="normal" text-anchor="start" fill="#263238">In demo mode the master does not</text>
<text x="379.0" y="178.4" font-size="10.5" font-weight="normal" text-anchor="start" fill="#263238">contact KSP.</text>
<text x="634.0" y="182.9" font-size="10.5" font-weight="bold" text-anchor="end" fill="#263238">&gt;&gt;</text>
<polyline points="185.0,186.0 185.0,209.0" fill="none" stroke="#263238" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahk)"/>
<text x="191.0" y="202.0" font-size="10" font-weight="bold" text-anchor="start" fill="#263238">NO</text>
<polygon points="40.0,234.0 54.0,210.0 316.0,210.0 330.0,234.0 316.0,258.0 54.0,258.0" fill="#ffffff" stroke="#263238" stroke-width="1.6"/>
<circle cx="20.0" cy="234.0" r="10" fill="#ffffff" stroke="#263238" stroke-width="1.4"/>
<text x="20.0" y="238.0" font-size="11" font-weight="bold" text-anchor="middle" fill="#263238">3</text>
<text x="185.0" y="225.2" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#263238">Kerbal Simpit missing, or Settings.cfg</text>
<text x="185.0" y="237.8" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#263238">without all five Simpit ports</text>
<text x="185.0" y="250.4" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#263238">at 115200 Bd?</text>
<polyline points="330.0,234.0 369.0,234.0" fill="none" stroke="#263238" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahk)"/>
<text x="350.0" y="229.0" font-size="10" font-weight="bold" text-anchor="middle" fill="#263238">YES</text>
<rect x="370.0" y="201.8" width="270.0" height="64.4" rx="0" fill="#ffffff" stroke="#263238" stroke-width="1.6"/>
<text x="379.0" y="218.9" font-size="10.5" font-weight="normal" text-anchor="start" fill="#263238">Install Kerbal Simpit. List each Simpit port</text>
<text x="379.0" y="231.5" font-size="10.5" font-weight="normal" text-anchor="start" fill="#263238">(the second COM port of each Teensy) in</text>
<text x="379.0" y="244.1" font-size="10.5" font-weight="normal" text-anchor="start" fill="#263238">its own SerialPort block at 115200 Bd</text>
<text x="379.0" y="256.7" font-size="10.5" font-weight="normal" text-anchor="start" fill="#263238">(Section 7.4).</text>
<text x="634.0" y="261.2" font-size="10.5" font-weight="bold" text-anchor="end" fill="#263238">&gt;&gt;</text>
<polyline points="185.0,258.0 185.0,281.0" fill="none" stroke="#263238" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahk)"/>
<text x="191.0" y="274.0" font-size="10" font-weight="bold" text-anchor="start" fill="#263238">NO</text>
<polygon points="40.0,306.0 54.0,282.0 316.0,282.0 330.0,306.0 316.0,330.0 54.0,330.0" fill="#ffffff" stroke="#263238" stroke-width="1.6"/>
<circle cx="20.0" cy="306.0" r="10" fill="#ffffff" stroke="#263238" stroke-width="1.4"/>
<text x="20.0" y="310.0" font-size="11" font-weight="bold" text-anchor="middle" fill="#263238">4</text>
<text x="185.0" y="303.5" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#263238">Controller re-plugged, or COM port</text>
<text x="185.0" y="316.1" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#263238">numbers changed?</text>
<polyline points="330.0,306.0 369.0,306.0" fill="none" stroke="#263238" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahk)"/>
<text x="350.0" y="301.0" font-size="10" font-weight="bold" text-anchor="middle" fill="#263238">YES</text>
<rect x="370.0" y="286.4" width="270.0" height="39.2" rx="0" fill="#ffffff" stroke="#263238" stroke-width="1.6"/>
<text x="379.0" y="303.5" font-size="10.5" font-weight="normal" text-anchor="start" fill="#263238">Identify the ports again (Section 7.3)</text>
<text x="379.0" y="316.1" font-size="10.5" font-weight="normal" text-anchor="start" fill="#263238">and correct Settings.cfg.</text>
<text x="634.0" y="320.6" font-size="10.5" font-weight="bold" text-anchor="end" fill="#263238">&gt;&gt;</text>
<polyline points="185.0,330.0 185.0,353.0" fill="none" stroke="#263238" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahk)"/>
<text x="191.0" y="346.0" font-size="10" font-weight="bold" text-anchor="start" fill="#263238">NO</text>
<polygon points="40.0,378.0 54.0,354.0 316.0,354.0 330.0,378.0 316.0,402.0 54.0,402.0" fill="#ffffff" stroke="#263238" stroke-width="1.6"/>
<circle cx="20.0" cy="378.0" r="10" fill="#ffffff" stroke="#263238" stroke-width="1.4"/>
<text x="20.0" y="382.0" font-size="11" font-weight="bold" text-anchor="middle" fill="#263238">5</text>
<text x="185.0" y="375.5" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#263238">A display NO ANSWER on the</text>
<text x="185.0" y="388.1" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#263238">Systems Information Display?</text>
<polyline points="330.0,378.0 369.0,378.0" fill="none" stroke="#263238" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahk)"/>
<text x="350.0" y="373.0" font-size="10" font-weight="bold" text-anchor="middle" fill="#263238">YES</text>
<rect x="370.0" y="358.4" width="270.0" height="39.2" rx="0" fill="#ffffff" stroke="#263238" stroke-width="1.6"/>
<text x="379.0" y="375.5" font-size="10.5" font-weight="normal" text-anchor="start" fill="#263238">That display does not answer the master.</text>
<text x="379.0" y="388.1" font-size="10.5" font-weight="normal" text-anchor="start" fill="#263238">Check its cable; power cycle.</text>
<text x="634.0" y="392.6" font-size="10.5" font-weight="bold" text-anchor="end" fill="#263238">&gt;&gt;</text>
<polyline points="185.0,402.0 185.0,425.0" fill="none" stroke="#263238" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahk)"/>
<text x="191.0" y="418.0" font-size="10" font-weight="bold" text-anchor="start" fill="#263238">NO</text>
<rect x="20.0" y="426.0" width="620.0" height="41.2" rx="0" fill="#ffffff" stroke="#263238" stroke-width="1.6"/>
<text x="29.0" y="444.1" font-size="10.5" font-weight="normal" text-anchor="start" fill="#263238">Reconnect (Section 8.8): wait up to 10 s for the automatic retry; restart the Kerbal Simpit</text>
<text x="29.0" y="456.7" font-size="10.5" font-weight="normal" text-anchor="start" fill="#263238">connection in KSP; if the link still does not recover, turn the controller off and on.</text>
<text x="634.0" y="462.2" font-size="10.5" font-weight="bold" text-anchor="end" fill="#263238">&gt;&gt;</text>
<text x="10.0" y="487.2" font-size="10" font-weight="normal" text-anchor="start" fill="#607d8b">Number: decision · YES: do the action on the right · NO: go down to the next step.</text>
<text x="10.0" y="501.2" font-size="10" font-weight="normal" text-anchor="start" fill="#607d8b">&gt;&gt;  End of procedure. If the symptom remains, return to that step and take its NO branch.</text>
</svg>