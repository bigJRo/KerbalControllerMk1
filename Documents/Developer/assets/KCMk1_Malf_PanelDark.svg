<text x="191.0" y="130.0" font-size="10" font-weight="bold" text-anchor="start" fill="#263238">NO</text>
<polygon points="40.0,162.0 54.0,138.0 316.0,138.0 330.0,162.0 316.0,186.0 54.0,186.0" fill="#ffffff" stroke="#263238" stroke-width="1.6"/>
<circle cx="20.0" cy="162.0" r="10" fill="#ffffff" stroke="#263238" stroke-width="1.4"/>
<text x="20.0" y="166.0" font-size="11" font-weight="bold" text-anchor="middle" fill="#263238">2</text>
<text x="185.0" y="165.8" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#263238">Only the SAS mode buttons dark?</text>
<polyline points="330.0,162.0 369.0,162.0" fill="none" stroke="#263238" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahk)"/>
<text x="350.0" y="157.0" font-size="10" font-weight="bold" text-anchor="middle" fill="#263238">YES</text>
<rect x="370.0" y="136.1" width="270.0" height="51.8" rx="0" fill="#ffffff" stroke="#263238" stroke-width="1.6"/>
<text x="379.0" y="153.2" font-size="10.5" font-weight="normal" text-anchor="start" fill="#263238">B2 SAS – ENAB. With SAS on, a dark mode</text>
<text x="379.0" y="165.8" font-size="10.5" font-weight="normal" text-anchor="start" fill="#263238">is not available: check the target, the</text>
<text x="379.0" y="178.4" font-size="10.5" font-weight="normal" text-anchor="start" fill="#263238">node or the pilot level.</text>
<text x="634.0" y="182.9" font-size="10.5" font-weight="bold" text-anchor="end" fill="#263238">&gt;&gt;</text>
<polyline points="185.0,186.0 185.0,209.0" fill="none" stroke="#263238" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahk)"/>
<text x="191.0" y="202.0" font-size="10" font-weight="bold" text-anchor="start" fill="#263238">NO</text>
