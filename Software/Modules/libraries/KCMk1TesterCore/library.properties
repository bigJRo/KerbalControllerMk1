sentence=Shared runtime for the Kerbal Controller Mk1 per-module tester sketches.
paragraph=Bus access to one module under test, INA228 power telemetry, the touchscreen UI, a step runner with a results summary and a serial report, and the test steps every module shares (identity, boot handshake, INT line, LED walk, LED states, brightness, bulb test, button walk, lifecycle, reset, supply current). Runs on the KC-01-9001 v2.0 Module Tester (Seeed XIAO RA4M1, ST7789V 240x320 + FT6236 touch).
category=Other
