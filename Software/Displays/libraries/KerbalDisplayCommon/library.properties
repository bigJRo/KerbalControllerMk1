name=KerbalDisplayCommon
version=3.5.0
author=Jason
maintainer=Jason
sentence=UI toolkit for RA8876-based (KCM_TFT) touchscreen displays used in KSP telemetry projects.
paragraph=Provides button drawing, proportional font text rendering, value formatting, and threshold-based color selection for the hardware rev-2 stack: a Teensy 4.1 driving a 7" 1024x600 RA8876 panel over a 16-bit 8080 parallel bus. Designed for use with the TeensyRA8876-8080 driver (via KCM_Display) and ILI9341_t3-format fonts. In-repo dependencies (KCM_Display, KCMk1_SystemConfig, KCM_Touch) are described in the README.
category=Display
url=
architectures=*
depends=TeensyRA8876-8080,ILI9341_fonts
